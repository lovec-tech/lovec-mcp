name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      # Run from /tmp so a module can't resolve from the checkout via cwd and
      # make a missing file look installed. Flat layout drops modules quietly.
      - name: Confirm the wheel ships every module and both entry points
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "
          import server, scan, lovec_api
          for m in (server, scan, lovec_api):
              assert 'site-packages' in m.__file__, m.__file__
          assert scan.BASE == lovec_api.BASE == server.BASE
          "
          test -x /tmp/wheel-check/bin/lovec-mcp
          test -x /tmp/wheel-check/bin/lovec-scan
          /tmp/wheel-check/bin/lovec-scan --help > /dev/null
