[project]
name = "lovec-mcp"
version = "0.1.1"
description = "Local MCP server for the lovec.tech prompt-injection detector"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "prompt-injection", "llm-security", "ai-safety"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Natural Language :: Russian",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/lovec-tech/lovec-mcp"
Repository = "https://github.com/lovec-tech/lovec-mcp"
Issues = "https://github.com/lovec-tech/lovec-mcp/issues"
API = "https://lovec.tech"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
lovec-mcp = "server:main"
lovec-scan = "scan:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Listed explicitly: flat-layout auto-discovery is where a build quietly ships
# one top-level module and drops the others.
[tool.setuptools]
py-modules = ["server", "scan", "lovec_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
